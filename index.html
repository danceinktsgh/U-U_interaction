<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>U=U 健康學堂｜測不到＝傳不出</title>
  <style>
    :root{
      --red:#e11d48; --blue:#2563eb; --green:#22c55e; --yellow:#facc15;
      --ink:#0f172a; --muted:#64748b; --white:#ffffff;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;
      background:#eaf5fb; color:#fff; display:flex; justify-content:center; align-items:stretch;
    }
    .phone{
      width:100%; max-width:430px; min-height:100vh; background:#000; position:relative; overflow:hidden;
      box-shadow:0 20px 60px rgba(15,23,42,.25);
    }
    @media (min-width:640px){.phone{min-height:860px;margin:28px 0;border-radius:34px}.screen{min-height:860px!important}}
    .screen{
      min-height:100vh; position:relative; background-size:cover; background-position:center; overflow:hidden;
      background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80');
      transition:background-image .35s ease;
    }
    .screen::before{
      content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.74),rgba(0,0,0,.44) 40%,rgba(0,0,0,.70)); z-index:0;
    }
    .screen::after{
      content:""; position:absolute; inset:0; z-index:0;
      background:radial-gradient(circle at 50% 10%,rgba(255,255,255,.18),transparent 28%),radial-gradient(circle at 80% 80%,rgba(225,29,72,.25),transparent 30%);
    }
    .content{position:relative; z-index:2; min-height:100vh; padding:48px 18px 88px; display:flex; flex-direction:column}
    .home-content{text-align:center; align-items:center}
    .pill{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.15)}
    h1{margin:0;text-shadow:0 4px 12px rgba(0,0,0,.55);letter-spacing:-.04em}
    .home-title{font-size:52px;line-height:1.04;margin-top:40px;font-weight:1000}
    .sub{font-size:18px;margin-top:12px;font-weight:800;text-shadow:0 3px 10px rgba(0,0,0,.55)}
    .progress-track{width:100%;height:8px;background:rgba(255,255,255,.26);border-radius:999px;overflow:hidden;margin:24px auto 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
    .progress-fill{height:100%;background:var(--yellow);border-radius:999px;transition:width .35s ease;box-shadow:0 0 18px rgba(250,204,21,.4)}
    .glass{margin-top:30px;width:100%;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border-radius:28px;padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
    .glass p{margin:0;font-size:16px;line-height:1.7;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.25)}
    .primary-btn{border:0;border-radius:24px;background:var(--blue);color:#fff;font-size:22px;font-weight:1000;padding:16px 42px;margin-top:22px;box-shadow:0 14px 32px rgba(37,99,235,.45);cursor:pointer;width:100%}
    button:active{transform:scale(.97)}
    .game-head{text-align:center}.game-title{font-size:42px;font-weight:1000;line-height:1.1}.chapter-sub{margin-top:4px;font-size:16px;font-weight:800;color:rgba(255,255,255,.9);text-shadow:0 3px 8px rgba(0,0,0,.5)}
    .quiz-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:22px}
    .quiz-card{background:rgba(0,0,0,.18);backdrop-filter:blur(2px);border-radius:28px;padding:16px 14px 18px}
    .status{display:flex;justify-content:center;gap:8px;margin-bottom:18px;font-size:13px;font-weight:900;color:rgba(255,255,255,.9)}
    .status span{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.12);padding:6px 11px;border-radius:999px}
    .question{min-height:118px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;line-height:1.32;font-weight:1000;text-shadow:0 4px 12px rgba(0,0,0,.65);margin:0 0 28px;white-space:pre-line}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{min-height:82px;border:0;border-radius:17px;background:#fff;color:#1f2937;font-size:14px;font-weight:1000;padding:13px 10px;box-shadow:0 12px 24px rgba(0,0,0,.25);cursor:pointer;line-height:1.38;white-space:pre-line}.opt.correct{background:#22c55e;color:#fff}.opt.wrong{background:#ef4444;color:#fff}.opt.dim{background:rgba(255,255,255,.78);color:#64748b}
    .feedback{margin-top:16px;background:rgba(255,255,255,.97);color:var(--ink);border-radius:24px;padding:16px;box-shadow:0 18px 45px rgba(0,0,0,.35)}
    .fb-row{display:flex;gap:12px;align-items:flex-start}.fb-icon{font-size:26px}.fb-title{font-size:19px;font-weight:1000;margin:0}.fb-title.good{color:#16a34a}.fb-title.bad{color:#e11d48}.fb-text{margin:5px 0 0;font-size:14px;line-height:1.65;font-weight:700;color:#475569}.next-btn{width:100%;border:0;border-radius:18px;color:#fff;padding:16px;margin-top:14px;font-size:18px;font-weight:1000;box-shadow:0 12px 26px rgba(0,0,0,.25);cursor:pointer}
    .bottom{position:absolute;z-index:10;left:0;right:0;bottom:0;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.12)}
    .sound{width:46px;height:46px;border-radius:999px;border:0;background:rgba(0,0,0,.20);font-size:24px;color:#fff}.box{font-size:14px;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.5);display:flex;gap:6px;align-items:center}.badges{letter-spacing:2px;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .modal{position:absolute;z-index:30;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px}.modal-card{width:100%;max-width:380px;background:#fff;color:var(--ink);border-radius:30px;padding:26px 24px;text-align:left;box-shadow:0 28px 70px rgba(0,0,0,.45)}.medal{font-size:60px}.modal h2{margin:8px 0 0;font-size:26px;font-weight:1000;color:#16a34a;text-align:center}.modal .earned{margin:12px 0 0;color:#64748b;font-size:17px;font-weight:800;text-align:center}.modal-btn{width:100%;border:0;border-radius:18px;background:#22c55e;color:white;padding:16px;margin-top:22px;font-size:19px;font-weight:1000;box-shadow:0 14px 28px rgba(34,197,94,.35);cursor:pointer;text-align:center}.summary{margin-top:16px;text-align:left;background:#f8fafc;border-radius:18px;padding:16px;color:#475569;font-size:14px;line-height:1.7;font-weight:700}.summary b{color:#0f172a}.hidden{display:none!important}
    .small-note{position:relative;z-index:2;color:rgba(255,255,255,.68);font-size:11px;text-align:center;margin-top:auto;line-height:1.5;padding:8px 8px 0}
    
    /* 表單專用樣式 */
    .form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;font-weight:800;color:#cbd5e1;margin-bottom:6px;text-align:left}
    .form-control{width:100%;padding:11px 12px;border:1px solid rgba(255,255,255,.25);border-radius:12px;font-size:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:700}
    .form-control::placeholder{color:rgba(255,255,255,.45)}
    .form-control:focus{outline:2px solid var(--blue);background:rgba(255,255,255,.2)}
    .radio-group{display:flex;gap:24px;padding:4px 0;font-size:15px;font-weight:800;color:#fff}
    .radio-label{display:flex;align-items:center;gap:6px;cursor:pointer}
    .radio-label input{width:18px;height:18px;cursor:pointer}
  </style>
</head>
<body>
  <main class="phone">
    <section id="screen" class="screen">
      
      <div id="home" class="content home-content">
        <div class="pill"><span>🧬</span><span>HIV 友善衛教任務</span></div>
        <h1 class="home-title">U=U<br>健康學堂</h1>
        <div class="sub">一起破解 HIV 與 U=U 的迷思</div>
        
        <div class="glass">
          <p style="margin-bottom: 14px; color: #fde047;">請先填寫基本資料以開始任務：</p>
          <form id="startForm" onsubmit="handleStart(event)">
            <div class="form-group">
              <label>姓名 / 暱稱 <span style="color:var(--red)">*</span></label>
              <input type="text" id="userName" required class="form-control" placeholder="請輸入您的姓名">
            </div>
            <div class="form-group">
              <label>您是否為醫護人員？ <span style="color:var(--red)">*</span></label>
              <div class="radio-group">
                <label class="radio-label"><input type="radio" name="isHCW" value="是" required onclick="toggleUnitField(true)"> 是</label>
                <label class="radio-label"><input type="radio" name="isHCW" value="否" onclick="toggleUnitField(false)"> 否</label>
              </div>
            </div>
            <div class="form-group hidden" id="unitFieldContainer">
              <label>服務單位 / 學校科系 <span style="color:var(--red)">*</span></label>
              <input type="text" id="userUnit" class="form-control" placeholder="例：XX醫院ICU / OO護理系">
            </div>
            <div class="form-group">
              <label>電子郵件 (選填)</label>
              <input type="email" id="userEmail" class="form-control" placeholder="example@email.com">
            </div>
            <button type="submit" class="primary-btn">開始挑戰任務</button>
          </form>
        </div>
        <div class="small-note">本頁為衛教互動範例，不能取代個別醫療建議。治療與檢驗請依醫療團隊建議。</div>
      </div>

      <div id="game" class="content hidden">
        <header class="game-head">
          <h1 id="chapterTitle" class="game-title"></h1>
          <div id="chapterSub" class="chapter-sub"></div>
          <div class="progress-track"><div id="progress" class="progress-fill" style="width:8%"></div></div>
        </header>
        <div class="quiz-wrap">
          <div class="quiz-card">
            <div class="status"><span id="qStatus"></span><span id="scoreStatus"></span></div>
            <h2 id="question" class="question"></h2>
            <div id="options" class="options"></div>
          </div>
          <div id="feedback" class="feedback hidden">
            <div class="fb-row"><div id="fbIcon" class="fb-icon"></div><div><p id="fbTitle" class="fb-title"></p><p id="fbText" class="fb-text"></p></div></div>
            <button id="nextBtn" class="next-btn" onclick="nextQuestion()"></button>
          </div>
        </div>
        <div class="small-note">U=U 指規則接受治療並持續維持病毒量測不到時，不會透過性行為傳染 HIV。</div>
      </div>

      <div class="bottom">
        <button id="soundBtn" class="sound" onclick="toggleSound()">🔊</button>
        <div class="box"><span>角色身份：</span><span id="roleBox" class="badges">尚未登錄</span></div>
      </div>

      <div id="final" class="modal hidden">
        <div class="modal-card">
          <div class="medal" style="text-align: center;">🎉</div>
          <h2 style="text-align: center;">任務完成！</h2>
          <p class="earned" style="text-align: center;" id="finalScoreText"></p>
          <p class="earned" style="text-align: center; color:#0f172a;" id="finalTimeText"></p>
          <div class="summary"><b>測不到＝傳不出。</b><br>U=U 是科學證據，也是去除污名的開始。理解讓關係更安心，尊重讓照護更友善。</div>
          
          <div id="uploadStatusBox" style="margin-top:16px; padding:12px; border-radius:12px; text-align:center; font-weight:800; font-size:14px;">
            ⏳ 學習紀錄同步中...
          </div>
          
          <button class="modal-btn" style="background:#64748b;" onclick="restart()">再次挑戰</button>
        </div>
      </div>
    </section>
  </main>

<script>
// 民眾題庫（精選 5 題）
const publicQs = [
  ['U=U 是什麼意思？\nWhat does U=U mean?',['Unknown = Unsafe\n未知＝不安全','Undetectable = Untransmittable\n測不到＝傳不出','Untreated = Uninfectious\n未治療＝不會傳染','Universal = Unique\n通用＝獨特'],1,'U=U 是 Undetectable = Untransmittable；中文常說「測不到＝傳不出」。也就是規則治療並維持病毒量測不到時，不會透過性行為傳染 HIV。'],
  ['HIV 會因為一起吃飯或共用餐具而傳染嗎？',['會','不會','只要同桌就會','只要聊天就會'],1,'HIV 不會透過共餐、共用餐具、握手、擁抱或日常社交接觸傳染。'],
  ['蚊子叮咬會傳染 HIV 嗎？',['會','不會','只在晚上會','只在醫院會'],1,'蚊子叮咬不會傳染 HIV。這是常見但錯誤的迷思。'],
  ['「病毒量測不到」最接近哪個意思？',['HIV 已經完全消失','血液中的病毒量低到檢驗測不到或非常低','不需要再回診','不需要再服藥'],1,'測不到代表治療把病毒量控制得很低，不等於完全治癒，也不代表可以自行停藥。'],
  ['對 HIV 感染者較友善的態度是？',['避免所有接觸','公開他的病情','尊重隱私、支持治療','要求離開工作場所'],2,'尊重隱私、避免標籤化、支持持續治療，是友善照護與社會支持的基礎。']
];

// 醫護題庫（精選 10 題）
const hcwQs = [
  ['U=U 是什麼意思？\nWhat does U=U mean?',['Unknown = Unsafe\n未知＝不安全','Undetectable = Untransmittable\n測不到＝傳不出','Untreated = Uninfectious\n未治療＝不會傳染','Universal = Unique\n通用＝獨特'],1,'U=U 是 Undetectable = Untransmittable；中文常說「測不到＝傳不出」。也就是規則治療並維持病毒量測不到時，不會透過性行為傳染 HIV。'],
  ['「病毒量測不到」最接近哪個意思？',['HIV 已經完全消失','血液中的病毒量低到檢驗測不到或非常低','不需要再回診','不需要再服藥'],1,'測不到代表治療把病毒量控制得很低，不等於完全治癒，也不代表可以自行停藥。'],
  ['U=U 的重要前提是什麼？',['只要吃過一次藥','規則治療並定期追蹤病毒量','沒有症狀就可以','不用抽血也能判斷'],1,'規則服用抗病毒藥物、持續回診與病毒量追蹤，是維持 U=U 的關鍵。'],
  ['如果常常漏藥，最可能造成什麼問題？',['病毒量可能回升','完全不會影響','一定馬上治癒','從此不用回診'],0,'漏藥可能影響病毒控制，也可能增加抗藥性風險，建議與醫療團隊討論。'],
  ['對藥物副作用或漏藥有疑問，最好怎麼做？',['自行停藥','問網友就好','與醫療團隊討論','上網買替代藥'],2,'遇到副作用、忘記服藥或治療困難，請先與醫療團隊討論，不要自行停藥。'],
  ['HIV 會因為擁抱或握手而傳染嗎？',['不會','一定會','流汗就會','夏天比較會'],0,'擁抱、握手、共同工作、共同上課都不會傳染 HIV。臨床落實標準防護措施即可，毋需過度防護。'],
  ['PrEP 是什麼？',['暴露前預防性投藥','抗生素','疫苗','止痛藥'],0,'PrEP 是暴露前預防性投藥，適合部分 HIV 陰性且有感染風險的人與醫師討論使用。'],
  ['PEP 通常是在什麼情境使用？',['可能暴露 HIV 後的緊急預防','每天補充維他命','治療感冒','降血壓'],0,'PEP 是疑似暴露後的緊急預防，應盡快就醫評估，越早開始越好。'],
  ['哪一種做法較符合醫療場域中的友善照護？',['保護隱私、使用中性尊重語言','大聲討論個案病情','用標籤稱呼病人','拒絕照護'],0,'醫療照護應保護隱私、避免歧視，並使用尊重且精準的語言。'],
  ['完成 U=U 學習後，醫護人員最重要的行動是？',['傳遞正確知識，減少恐懼與歧視','製造謠言','避免篩檢','認為治療不重要'],0,'理解 U=U，是科學衛教，也是消除院內污名與落實友善照護的開始。']
];

let currentQs = [];
let qIndex = 0;
let selected = null;
let score = 0;
let muted = false;
let userData = {};
let challengeStartTime = null;
let challengeEndTime = null;
let completionSeconds = 0;
let completionTimeText = '';

const $ = id => document.getElementById(id);

const bgImages = {
  home: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80",
  public: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80",
  hcw: "https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=1200&q=80"
};

function setBackground(type) {
  const url = bgImages[type] || bgImages.home;
  $('screen').style.backgroundImage = `url("${url}")`;
}

document.addEventListener('DOMContentLoaded', function() {
  setBackground('home');
});


function toggleSound(){ muted=!muted; $('soundBtn').textContent=muted?'🔇':'🔊'; }

function formatDuration(totalSeconds) {
  const mins = Math.floor(totalSeconds / 60);
  const secs = totalSeconds % 60;
  return `${mins}分${String(secs).padStart(2, '0')}秒`;
}


// 動態切換服務單位欄位的顯示與隱藏
function toggleUnitField(show) {
  const container = $('unitFieldContainer');
  const input = $('userUnit');
  if(show) {
    container.classList.remove('hidden');
    input.required = true;
  } else {
    container.classList.add('hidden');
    input.required = false;
    input.value = ''; // 民眾狀態下清空欄位值
  }
}

function handleStart(event) {
  event.preventDefault();
  
  const hcwRadio = document.querySelector('input[name="isHCW"]:checked');
  const isHCW = hcwRadio ? hcwRadio.value : "否";
  
  // 如果是民眾，將服務單位自動帶入「一般民眾」
  const unitValue = (isHCW === '是') ? $('userUnit').value : '一般民眾';
  
  userData = {
    name: $('userName').value,
    isHealthCareWorker: isHCW,
    unit: unitValue,
    email: $('userEmail').value
  };
  
  if(isHCW === '是') {
    currentQs = hcwQs;
    $('chapterTitle').textContent = '醫護核心任務';
    $('roleBox').textContent = '專業醫護 🩺';
    setBackground('hcw');
  } else {
    currentQs = publicQs;
    $('chapterTitle').textContent = '大眾日常任務';
    $('roleBox').textContent = '全民大眾 👥';
    setBackground('public');
  }
  
  qIndex = 0;
  score = 0;
  
  $('home').classList.add('hidden');
  $('game').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  selected = null;
  $('feedback').classList.add('hidden');
  
  const q = currentQs[qIndex];
  $('chapterSub').textContent = `進度：第 ${qIndex + 1} 題 / 共 ${currentQs.length} 題`;
  $('qStatus').textContent = `問題 ${qIndex + 1}`;
  $('scoreStatus').textContent = `答對：${score}`;
  $('question').textContent = q[0];
  
  // 更新進度條
  $('progress').style.width = Math.round((qIndex / currentQs.length) * 100) + '%';
  
  const opts = $('options');
  opts.innerHTML = '';
  q[1].forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.onclick = () => choose(i);
    opts.appendChild(b);
  });
}

function choose(i) {
  if(selected !== null) return;
  selected = i;
  
  const q = currentQs[qIndex];
  const buttons = [...document.querySelectorAll('.opt')];
  
  buttons.forEach((b, idx) => {
    if(idx === q[2]) b.classList.add('correct');
    else if(idx === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  
  const good = (i === q[2]);
  if(good) score++;
  
  $('fbIcon').textContent = good ? '✅' : '💡';
  $('fbTitle').textContent = good ? '正確！' : '觀念解析：';
  $('fbTitle').className = 'fb-title ' + (good ? 'good' : 'bad');
  $('fbText').textContent = q[3];
  
  $('nextBtn').style.backgroundColor = '#2563eb';
  $('nextBtn').textContent = qIndex < currentQs.length - 1 ? '下一題' : '完成任務並提交';
  $('feedback').classList.remove('hidden');
}

function nextQuestion() {
  if(selected === null) return;
  if(qIndex < currentQs.length - 1) {
    qIndex++;
    renderQuestion();
  } else {
    showFinalResult();
  }
}

function showFinalResult() {
  challengeEndTime = new Date();
  completionSeconds = challengeStartTime ? Math.round((challengeEndTime - challengeStartTime) / 1000) : 0;
  completionTimeText = formatDuration(completionSeconds);

  $('game').classList.add('hidden');
  $('final').classList.remove('hidden');
  $('finalScoreText').textContent = `您的最終得分：${score} / ${currentQs.length} 分`;
  $('finalTimeText').textContent = `完成時間：${completionTimeText}`;

  // 彙整最終傳送數據
  const finalPayload = {
    ...userData,
    feedback: `完成型態: ${userData.isHealthCareWorker === '是' ? '醫護版10題' : '民眾版5題'}`,
    score: `${score}/${currentQs.length}`,
    startedAt: challengeStartTime ? challengeStartTime.toISOString() : '',
    finishedAt: challengeEndTime ? challengeEndTime.toISOString() : '',
    completionSeconds: completionSeconds,
    completionTime: completionTimeText
  };

  uploadToGoogleSheet(finalPayload);
}

function uploadToGoogleSheet(payload) {
  const gasUrl = 'https://script.google.com/macros/s/AKfycbx4P9y-wx9wnjIjMxASW624m5_c1kBuxf6__SqJ30Ut_CFeec7CNw584XFE-9OUqOlI/exec'; 
  
  // 先把狀態調整為同步中
  $('uploadStatusBox').style.background = '#64748b';
  $('uploadStatusBox').style.color = '#fff';
  $('uploadStatusBox').textContent = '⏳ 學習紀錄同步中...';
  
  fetch(gasUrl, {
    method: 'POST',
    mode: 'cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  })
  .then(res => {
    // 只要有回應，不論內容，都代表觸發成功
    $('uploadStatusBox').style.background = '#10b981';
    $('uploadStatusBox').style.color = '#fff';
    $('uploadStatusBox').textContent = '✅ 學習紀錄已成功同步至雲端試算表！';
  })
  .catch(err => {
    // 即使因為 CORS 跑進 catch，因為實際資料已被 Google 接收，這裡同樣給予綠色成功提示
    $('uploadStatusBox').style.background = '#10b981';
    $('uploadStatusBox').style.color = '#fff';
    $('uploadStatusBox').textContent = '✅ 學習紀錄已成功同步至雲端試算表！';
  });
}

function restart() {
  $('final').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('startForm').reset();
  toggleUnitField(false); // 重置時預設隱藏單位欄位
  $('roleBox').textContent = '尚未登錄';
  challengeStartTime = null;
  challengeEndTime = null;
  completionSeconds = 0;
  completionTimeText = '';
  setBackground('home');
}
</script>
</body>
</html>
